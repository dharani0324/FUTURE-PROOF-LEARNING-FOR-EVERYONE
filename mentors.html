{% extends 'layout.html' %}

{% block content %}
<div class="page-header" style="margin-bottom: 2rem; text-align: center;">
    <h2>Our Mentors</h2>
    <p>Connect with industry experts to guide your journey.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 1rem;">
    {% for mentor in mentors %}
    <div class="card" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem 2rem;">
        <div style="display: flex; gap: 1.5rem; align-items: center;">
            <i class="fa-solid fa-user-circle fa-4x" style="color: var(--text-muted);"></i>
            <div style="text-align: left;">
                <h3 style="margin: 0 0 5px 0; color: #111827; font-size: 1.25rem;">{{ mentor.name }}</h3>
                <p style="color: var(--primary); font-weight: 500; margin: 0; font-size: 0.95rem;">{{ mentor.expertise }}</p>
            </div>
        </div>
        <div>
            <a href="mailto:{{ mentor.email }}" class="btn btn-outline" style="padding: 0.5rem 1.5rem;"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
